# ============================================================================
# tts-on-demand.yml
# Synthesizes one pasted-text job on demand. Dispatched by the tts-jobs
# Supabase edge function when a user submits text in the web app. Progress is
# reported back to the API by src/audiobooks/tts_on_demand.py, so this workflow
# only needs to run the job, not report on it.
#
# Uses the same secret as daily-digest.yml:
#   CONFIG_INI   Full text of src/audiobooks/config.ini (for API_URL/API_KEY)
#   HF_TOKEN     HuggingFace token for the Kokoro model download
#
# Dispatch manually for testing:
#   gh workflow run tts-on-demand.yml -f job_id=<tts_jobs row id>
# ============================================================================

name: TTS On Demand

run-name: TTS job ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "tts_jobs row id (UUID)"
        required: true
        type: string

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Same cache key as daily-digest.yml so the Kokoro weights are shared.
      - name: Cache HuggingFace models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface/hub
          key: hf-models-${{ runner.os }}-kokoro-82m-minilm-l6-v2-v1
          restore-keys: |
            hf-models-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends espeak-ng ffmpeg

      - name: Install Python dependencies
        run: |
          pip install --quiet torch torchaudio \
            --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet -r src/audiobooks/requirements.txt

      - name: Write config.ini from secrets
        working-directory: src/audiobooks
        env:
          CONFIG_INI: ${{ secrets.CONFIG_INI }}
        run: printf '%s' "$CONFIG_INI" > config.ini

      # The job id is passed through an env var and validated as a UUID, so
      # the dispatch input never reaches the shell as code.
      - name: Run TTS job
        env:
          JOB_ID: ${{ inputs.job_id }}
          PYTHONUNBUFFERED: "1"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Same single-Kokoro-pipeline cap as daily-digest.yml (2 vCPU, 7 GB).
          TTS_MAX_WORKERS: "2"
        run: |
          set -euo pipefail
          if ! [[ "$JOB_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "job_id is not a UUID: $JOB_ID" >&2
            exit 1
          fi
          python src/audiobooks/tts_on_demand.py --job-id "$JOB_ID"
